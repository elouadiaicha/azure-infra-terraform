repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform Format
        language: system
        entry: terraform
        args:
          - -chdir=terraform
          - fmt
          - -recursive
        pass_filenames: false