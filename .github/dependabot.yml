version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    commit-message:
      prefix: "ci"

    labels:
      - "dependencies"

    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"

    commit-message:
      prefix: "terraform"

    labels:
      - "dependencies"

    open-pull-requests-limit: 5
